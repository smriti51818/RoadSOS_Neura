name: roadsos
description: Road safety emergency response app for IIT Madras Hackathon 2026
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3

  # Local database — offline-first
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Location & Maps
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Secure storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # Background services
  flutter_background_service: ^5.0.5
  connectivity_plus: ^6.0.3

  # Permissions
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^13.2.0

  # Localization
  flutter_localizations:
    sdk: flutter

  # UI & Fonts
  google_fonts: ^6.2.1

  # Communication
  url_launcher: ^6.3.0
  share_plus: ^13.1.0

  # Speech for Voice SOS
  speech_to_text: ^7.4.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.20.0
  battery_plus: ^7.0.0
  image_picker: ^1.1.2
  postgres: ^3.5.12
  flutter_contacts: ^2.2.1
  flutter_polyline_points: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/country_config.json
    - assets/data/emergency_numbers.json
    - assets/data/decision_trees.json
    - assets/data/country_boundaries.geojson
    - assets/data/seed_services.json
